<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CBG Production Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#EEF2F7;--surface:#FFFFFF;--surface-2:#F5F8FB;--ink:#0E1B2C;--muted:#5B6878;--line:#D9E1EA;
  --navy:#01427A;--navy-2:#0B5CA8;--sky:#6FA3D6;--pale:#D6E5F4;--amber:#E0A21B;--good:#1E8449;--bad:#C0392B;--target:#8A96A5;
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1320;--surface:#111D2E;--surface-2:#16243A;--ink:#E6EDF6;--muted:#9AA9BC;--line:#23344D;
  --navy:#5B9BE0;--navy-2:#8DBDF0;--sky:#3D6FA3;--pale:#1B3150;--amber:#F2B83A;--good:#58C98A;--bad:#EF7A6B;--target:#7D8CA0;}}
:root[data-theme="dark"]{
  --bg:#0A1320;--surface:#111D2E;--surface-2:#16243A;--ink:#E6EDF6;--muted:#9AA9BC;--line:#23344D;
  --navy:#5B9BE0;--navy-2:#8DBDF0;--sky:#3D6FA3;--pale:#1B3150;--amber:#F2B83A;--good:#58C98A;--bad:#EF7A6B;--target:#7D8CA0;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
[hidden]{display:none!important}

.hdr{position:relative;overflow:hidden;background:var(--surface);border-bottom:4px solid #01427A;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.wave{position:absolute;right:0;top:0;height:100%;width:420px;pointer-events:none;opacity:.9}
.brand{display:flex;align-items:center;gap:16px;position:relative;min-width:0}
.logo{height:64px;width:auto;flex:none}
:root[data-theme="dark"] .logo{background:#fff;border-radius:6px;padding:4px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{background:#fff;border-radius:6px;padding:4px}}
h1{font-family:var(--cond);font-weight:700;font-size:30px;letter-spacing:1px;text-transform:uppercase;margin:0;color:var(--navy);line-height:1.05}
.brand p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
.hdr-r{position:relative;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.upd{font-size:12.5px;color:var(--muted);text-align:right;max-width:280px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:#01427A;border-color:#01427A;color:#fff}
.btn.primary:hover{background:#0B5CA8}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}

.bar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px;padding:14px 22px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.bar label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:500}
.bar select,.bar input[type=date]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-width:120px;font-size:14px;color:var(--ink)}
.seg{display:inline-flex;border:1px solid #01427A;border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 16px;cursor:pointer;font-weight:600;color:var(--navy)}
.seg button+button{border-left:1px solid #01427A}
.seg button[aria-pressed="true"]{background:#01427A;color:#fff}
.bar .chk{flex-direction:row;align-items:center;gap:6px;font-size:14px;color:var(--ink);padding-bottom:7px;cursor:pointer}
.ptxt{margin-left:auto;font-family:var(--cond);font-size:20px;font-weight:600;color:var(--navy);padding-bottom:4px}

main{padding:18px 22px 36px;max-width:1500px;margin:0 auto}
.sec{font-family:var(--cond);font-weight:600;font-size:15px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.sec:first-child{margin-top:0}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tiles.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.tf{font-size:12px;color:var(--muted);margin-top:1px}
.nodata{height:100%;min-height:150px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:13.5px;padding:10px;border:1px dashed var(--line);border-radius:6px}
.tile{background:var(--surface);border:1px solid var(--line);border-top:4px solid #01427A;border-radius:8px;padding:12px 14px 12px;min-width:0}
.tile.good{border-top-color:var(--good)} .tile.bad{border-top-color:var(--bad)}
.tl{font-size:13.5px;font-weight:600;color:var(--muted)}
.tv{font-family:var(--cond);font-weight:700;font-size:38px;line-height:1.05;margin:3px 0 2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv small{font-size:17px;color:var(--muted);font-weight:600;margin-left:4px}
.tv.na{font-size:22px;color:var(--muted);font-weight:500;padding:10px 0 4px}
.ts{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ts.good{color:var(--good)} .ts.bad{color:var(--bad)}
.pbar{position:relative;height:8px;background:var(--pale);border-radius:4px;margin:7px 0 6px}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:#01427A}
.pbar.good i{background:var(--good)} .pbar.bad i{background:var(--bad)}
.pbar b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px 10px;min-width:0}
.panel h2{font-size:15px;font-weight:600;margin:0}
.panel .hint{font-size:12.5px;color:var(--muted);margin:1px 0 8px}
.cv{position:relative;height:270px}.cv.sm{height:200px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s6{grid-column:span 6}.s4{grid-column:span 4}.s3{grid-column:span 3}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:34px 28px;max-width:680px;margin:30px auto;text-align:center}
.empty h2{font-family:var(--cond);font-size:28px;color:var(--navy);margin:0 0 8px}
.empty p{color:var(--muted);margin:0 0 14px}

dialog{border:0;border-radius:10px;padding:0;width:min(720px,94vw);max-height:90vh;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(5,15,30,.55)}
.dlg{display:flex;flex-direction:column;max-height:90vh}
.dlg-h{padding:16px 20px 8px}
.dlg-h h2{font-family:var(--cond);font-size:24px;color:var(--navy);margin:0}
.dlg-h p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.dlg-b{padding:4px 20px 8px;overflow:auto}
.dlg-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.dlg-f .msg{margin-right:auto;font-size:13px;color:var(--bad)}
.frow{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.frow label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:500}
.frow select,.frow input,.mt select,.tg input{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:14px;color:var(--ink)}
.mt{width:100%;border-collapse:collapse;font-size:13.5px}
.mt td,.mt th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.mt th{font-size:12px;color:var(--muted);font-weight:600}
.mt tr.grp td{font-family:var(--cond);font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--navy);padding-top:12px;border-bottom:0}
.mt select{width:100%;max-width:260px}
.mt td.smp{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.tg{display:grid;grid-template-columns:1fr 110px 110px;gap:8px 12px;align-items:center;font-size:14px}
.tg .h{font-size:12px;color:var(--muted);font-weight:600}
.tg input{width:100%}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:92vw;z-index:10}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:1250px){.tiles.five{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1100px){.tiles,.tiles.five{grid-template-columns:repeat(2,minmax(0,1fr))}.s8,.s6,.s4{grid-column:span 12}.s3{grid-column:span 6}}
@media (max-width:640px){
  .hdr{padding:12px 14px}.logo{height:48px}h1{font-size:23px}.wave{width:220px;opacity:.5}
  .bar{padding:12px 14px}.ptxt{margin-left:0;width:100%}
  main{padding:14px 12px 30px}.tv{font-size:31px}.s3{grid-column:span 12}.tiles{gap:8px}.tile{padding:10px 11px}
  .upd{text-align:left}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
/* ============ constants ============ */
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_L=['January','February','March','April','May','June','July','August','September','October','November','December'];
const UT=['water','fuel','co2','elec'];
const UT_NAME={water:'Water',fuel:'Fuel',co2:'CO₂',elec:'Electricity'};
const UT_UNIT={water:'hl/hl',fuel:'L/hl',co2:'kg/hl',elec:'kWh/hl'};
const DEF_SETTINGS={targets:{cph:null,pcph:null,pm:70,loss:null,water:null,fuel:null,co2:null,elec:null}};
const NUM_KEYS=['cases','availMin','fillMin','bbtHl','bottledHl','pmPlanned','pmDone','pmPct','elec','water','fuel','co2','utilHl','plMtd','plYtd','plTgt'];
const FIELDS=[
  {g:'Production'},
  {k:'date',l:'Date',req:true},
  {k:'cases',l:'Cases bottled'},
  {k:'availMin',l:'Available time (minutes)'},
  {k:'fillMin',l:'Filling time (minutes)'},
  {g:'Maintenance'},
  {k:'pmPlanned',l:'PMs planned / scheduled'},
  {k:'pmDone',l:'PMs completed'},
  {k:'pmPct',l:'PM compliance % (if already calculated)'},
  {g:'Utilities'},
  {k:'elec',l:'Electricity (kWh)'},{k:'water',l:'Water (hl)'},{k:'fuel',l:'Fuel (L)'},{k:'co2',l:'CO₂ (kg)'},
  {k:'utilHl',l:'Production volume for utility ratios (hl)'},
  {g:'Process loss'},
  {k:'plMtd',l:'Process loss % (month to date)'},
];

/* ============ state ============ */
const S={mode:'ytd',year:null,month:null,date:null,excl:false};
let MONTHS_DATA={},INFO=null,SETTINGS=structuredClone(DEF_SETTINGS),RECS=[],READY=false,LOAD_ERR=null,charts=[],PER=null;
const CAN_WRITE=false;

/* ============ data: built by GitHub Actions from the files in data/raw ============ */
function mergeSettings(s){const o=structuredClone(DEF_SETTINGS);if(s&&s.targets)for(const k in s.targets)if(s.targets[k]!=null&&s.targets[k]!=='')o.targets[k]=s.targets[k];return o}
async function loadData(){
  try{
    const r=await fetch('data/dashboard-data.json?v='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    MONTHS_DATA=j.months||{};INFO=j;SETTINGS=mergeSettings({targets:j.targets||{}});
  }catch(e){LOAD_ERR=e.message||String(e)}
  READY=true;rebuild();
}

/* ============ records ============ */
function rebuild(){
  RECS=[];
  for(const id of Object.keys(MONTHS_DATA).sort()){
    const rows=(MONTHS_DATA[id]&&MONTHS_DATA[id].rows)||{};
    for(const ds of Object.keys(rows).sort()){const [y,m,d]=ds.split('-').map(Number);RECS.push({...rows[ds],ds,y,m:m-1,d})}
  }
  flagAnomalies();
  const ys=yearList();
  if(S.year==null||!ys.includes(S.year)){const last=RECS[RECS.length-1];S.year=last?last.y:2026}
  render();
}
function yearList(){const s=new Set([2026,2027,2028]);RECS.forEach(r=>s.add(r.y));return [...s].sort()}
const AN_METRICS=['cph','pcph',...UT];
function flagAnomalies(){
  const vals={};AN_METRICS.forEach(m=>vals[m]=[]);
  for(const r of RECS){r._an={};r._v={};const a=agg([r],true);AN_METRICS.forEach(m=>{r._v[m]=a[m];if(a[m]!=null&&a[m]>0)vals[m].push(a[m])})}
  const lim={};
  AN_METRICS.forEach(m=>{const v=vals[m].sort((a,b)=>a-b);if(v.length<10)return;
    const med=v[Math.floor(v.length/2)],dev=v.map(x=>Math.abs(x-med)).sort((a,b)=>a-b),mad=dev[Math.floor(dev.length/2)]*1.4826;
    if(mad>0)lim[m]=[med-5*mad,med+5*mad]});
  for(const r of RECS)AN_METRICS.forEach(m=>{const x=r._v[m];if(x!=null&&lim[m]&&(x<lim[m][0]||x>lim[m][1]))r._an[m]=true});
}

/* ============ aggregation ============ */
function agg(recs,raw){
  const sk=(r,m)=>!raw&&S.excl&&r._an&&r._an[m];
  let cases=0,nc=0,ca=0,av=0,cf=0,fi=0,pd=0,pp=0,ps=0,pn=0,lastPL=null;
  const U={};UT.forEach(u=>U[u]={c:0,v:0});
  for(const r of recs){
    if(r.cases!=null){cases+=r.cases;nc++}
    if(r.cases!=null&&r.availMin>0&&!sk(r,'cph')){ca+=r.cases;av+=r.availMin}
    if(r.cases!=null&&r.fillMin>0&&!sk(r,'pcph')){cf+=r.cases;fi+=r.fillMin}
    if(r.pmPlanned>0&&r.pmDone!=null){pd+=r.pmDone;pp+=r.pmPlanned}else if(r.pmPct!=null){ps+=r.pmPct;pn++}
    for(const u of UT)if(r[u]!=null&&!sk(r,u)&&!(recs.length===1&&r[u]===0)){U[u].c+=r[u];U[u].v+=r.utilHl||0}
    if(r.plMtd!=null)lastPL=r;
  }
  const o={cases:nc?cases:null,cph:av?ca/(av/60):null,pcph:fi?cf/(fi/60):null,
    pm:pp?pd/pp*100:pn?ps/pn:null,loss:lastPL?lastPL.plMtd:null,lossYtd:lastPL&&lastPL.plYtd!=null?lastPL.plYtd:null,lossTgt:lastPL?lastPL.plTgt:null};
  UT.forEach(u=>o[u]=U[u].v>0?U[u].c/U[u].v:null);
  return o;
}

/* ============ periods ============ */
const yRecs=y=>RECS.filter(r=>r.y===y);
const pad=n=>String(n).padStart(2,'0');
const dstr=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
const fdate=ds=>{const [y,m,d]=ds.split('-').map(Number);return `${d} ${MONTHS[m-1]} ${y}`};
function syncSelection(){
  const yr=yRecs(S.year),ms=[...new Set(yr.map(r=>r.m))];
  if(!ms.includes(S.month))S.month=ms.length?ms[ms.length-1]:null;
  const inM=yr.filter(r=>r.m===S.month);
  if(!inM.some(r=>r.ds===S.date))S.date=inM.length?inM[inM.length-1].ds:null;
}
function period(){
  const yr=yRecs(S.year);
  if(S.mode==='ytd'){
    const last=yr[yr.length-1];let prev=null;
    if(last){const cut=dstr(S.year-1,last.m,last.d),py=yRecs(S.year-1).filter(r=>r.ds<=cut);if(py.length)prev={recs:py,label:`YTD ${S.year-1}`}}
    return {cur:{recs:yr,label:last?`Year to date ${S.year} (1 Jan to ${last.d} ${MONTHS[last.m]})`:`Year to date ${S.year}`},prev,
      series:[...new Set(yr.map(r=>r.m))].map(m=>({k:MONTHS[m],title:`${MONTHS_L[m]} ${S.year}`,recs:yr.filter(r=>r.m===m)}))};
  }
  const mr=yr.filter(r=>r.m===S.month);
  const series=mr.map(r=>({k:String(r.d),title:fdate(r.ds),recs:[r],ds:r.ds}));
  const pm=S.month===0?{y:S.year-1,m:11}:{y:S.year,m:S.month-1};
  const pr=RECS.filter(r=>r.y===pm.y&&r.m===pm.m);
  if(S.mode==='month')return {cur:{recs:mr,label:`${MONTHS_L[S.month]} ${S.year}`},prev:pr.length?{recs:pr,label:`${MONTHS[pm.m]} ${pm.y}`}:null,series};
  const i=RECS.findIndex(r=>r.ds===S.date),rec=RECS[i];
  return {cur:{recs:rec?[rec]:[],label:S.date?fdate(S.date):''},prev:i>0?{recs:[RECS[i-1]],label:fdate(RECS[i-1].ds)}:null,series,hl:S.date?String(+S.date.slice(8)):null};
}
function monthDoc(y,m){return MONTHS_DATA[`${y}-${pad(m+1)}`]}
function fileTarget(k){
  // latest month (up to the selected period) whose uploaded files carried this target
  const upto=S.mode==='ytd'?11:S.month;
  for(let m=upto;m>=0;m--){const d=monthDoc(S.year,m);if(d&&d.targets&&d.targets[k]!=null)return d.targets[k]}
  return null;
}
function target(k){const s=SETTINGS.targets[k];if(s!=null&&s!=='')return +s;return fileTarget(k)}

/* ============ formatting ============ */
const nf=(n,dp=0)=>n==null?'–':n.toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const col=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/* ============ render ============ */
const KPI={
  cases:{l:'Production cases',dp:0,up:true,unit:'',f:'Cases bottled'},
  cph:{l:'Cases per hour',dp:0,up:true,unit:'',f:'Cases ÷ available hours'},
  pcph:{l:'Production cases per hour',dp:0,up:true,unit:'',f:'Cases ÷ filling hours'},
  pm:{l:'PM compliance',dp:1,up:true,unit:'%',pct:true,f:'PMs completed ÷ planned'},
  loss:{l:'Process loss',dp:2,up:false,unit:'%',pct:true},
  water:{l:'Water',dp:2,up:false,unit:'hl/hl'},fuel:{l:'Fuel',dp:2,up:false,unit:'L/hl'},co2:{l:'CO₂',dp:2,up:false,unit:'kg/hl'},elec:{l:'Electricity',dp:2,up:false,unit:'kWh/hl'},
};
function valOf(k,a){return k==='loss'&&S.mode==='ytd'?a.lossYtd:a[k]}
function tile(k,a,p){
  const K=KPI[k],v=valOf(k,a),u=K.unit;
  let t=target(k);
  const foot=k==='loss'?(S.mode==='ytd'?'Volume, year to date':S.mode==='month'?'Volume, month to date':'Volume, month to date on this day'):K.f||'';
  if(v==null){const msg=k==='pm'?'No PM data uploaded yet':'No data for this period';
    return `<div class="tile"><div class="tl">${K.l}</div><div class="tf">${foot}</div><div class="tv na">${msg}</div>${t!=null?`<div class="ts">Target ${K.up?'≥':'≤'} ${nf(+t,K.dp)}${u==='%'?'%':' '+u}</div>`:''}</div>`}
  let cls='',tline='<div class="ts">No target set</div>';
  if(k==='cases'){
    const plan=S.mode==='month'?fileTarget('cases'):null;
    if(plan){const pc=v/plan*100;tline=`<div class="ts">${nf(pc,1)}% of monthly plan (${nf(plan)})</div>`}else tline='<div class="ts">&nbsp;</div>';
  }else if(t!=null){const d=v-t,good=K.up?d>=0:d<=0;cls=good?'good':'bad';
    tline=`<div class="ts ${cls}">Target ${K.up?'≥':'≤'} ${nf(+t,K.dp)}${u==='%'?'%':u?' '+u:''}, ${d>=0?'+':'−'}${nf(Math.abs(d),K.dp)}${K.pct?' pts':''}</div>`}
  let cmp='<div class="ts">&nbsp;</div>';
  const pv=p?valOf(k,p):null;
  if(pv!=null){const d=K.pct?v-pv:(pv?(v-pv)/Math.abs(pv)*100:null);

/* ---- targets for any period (not tied to the dashboard's current view) ---- */
function tgtFor(k,y,m){
  const s=SETTINGS.targets[k];if(s!=null&&s!=='')return +s;
  for(let mm=m;mm>=0;mm--){const d=monthDoc(y,mm);if(d&&d.targets&&d.targets[k]!=null)return d.targets[k]}
  return null;
}

/* ---- period resolution ---- */
function rptPeriod(o){
  const byDay=(a,b)=>RECS.filter(r=>r.ds>=a&&r.ds<=b);
  const lastDay=(y,m)=>new Date(y,m+1,0).getDate();
  const shiftYear=ds=>`${+ds.slice(0,4)-1}${ds.slice(4)}`;
  let P;
  if(o.kind==='ytd'){
    const y=+o.year,recs=RECS.filter(r=>r.y===y);if(!recs.length)return null;
    const end=recs[recs.length-1].ds;
    P={recs,label:`Year to date ${y}`,sub:`1 Jan to ${fdate(end)}`,grain:'month',start:`${y}-01-01`,end,y,m:recs[recs.length-1].m,ytd:true};
    const ly=byDay(shiftYear(P.start),shiftYear(end));
    P.prev=ly.length?{recs:ly,label:`YTD ${y-1}`}:null;
  }else if(o.kind==='month'){
    const [y,m]=o.month.split('-').map(Number);const recs=RECS.filter(r=>r.y===y&&r.m===m-1);if(!recs.length)return null;
    P={recs,label:`${MONTHS_L[m-1]} ${y}`,sub:`1 to ${recs[recs.length-1].d} ${MONTHS[m-1]} ${y}`,grain:'day',start:recs[0].ds,end:recs[recs.length-1].ds,y,m:m-1,month:true};
    if(o.cmp==='ly'){const ly=RECS.filter(r=>r.y===y-1&&r.m===m-1);P.prev=ly.length?{recs:ly,label:`${MONTHS[m-1]} ${y-1}`}:null}
    else{const pm=m-1===0?{y:y-1,m:11}:{y,m:m-2};const pr=RECS.filter(r=>r.y===pm.y&&r.m===pm.m);P.prev=pr.length?{recs:pr,label:`${MONTHS[pm.m]} ${pm.y}`}:null}
  }else if(o.kind==='day'){
    const i=RECS.findIndex(r=>r.ds===o.date);if(i<0)return null;const r=RECS[i];
    P={recs:[r],label:fdate(r.ds),sub:'Single day',grain:'day',start:r.ds,end:r.ds,y:r.y,m:r.m,day:true,context:RECS.filter(x=>x.y===r.y&&x.m===r.m&&x.ds<=r.ds)};
    if(o.cmp==='ly'){const ly=RECS.filter(x=>x.ds===shiftYear(r.ds));P.prev=ly.length?{recs:ly,label:fdate(shiftYear(r.ds))}:null}
    else P.prev=i>0?{recs:[RECS[i-1]],label:fdate(RECS[i-1].ds)}:null;
  }else{
    let a=o.from,b=o.to;if(!a||!b)return null;if(a>b)[a,b]=[b,a];
    const recs=byDay(a,b);if(!recs.length)return null;
    const span=(new Date(b)-new Date(a))/864e5+1;
    P={recs,label:`${fdate(a)} to ${fdate(b)}`,sub:`${Math.round(span)} days`,grain:span>62?'month':'day',start:a,end:b,y:+b.slice(0,4),m:+b.slice(5,7)-1,range:true,ytd:a.slice(5)==='01-01'};
    if(o.cmp==='ly'){const ly=byDay(shiftYear(a),shiftYear(b));P.prev=ly.length?{recs:ly,label:`Same dates ${+a.slice(0,4)-1}`}:null}
    else{const pe=new Date(a);pe.setDate(pe.getDate()-1);const ps=new Date(pe);ps.setDate(ps.getDate()-span+1);
      const f=d=>dstr(d.getFullYear(),d.getMonth(),d.getDate());const pr=byDay(f(ps),f(pe));P.prev=pr.length?{recs:pr,label:`${fdate(f(ps))} to ${fdate(f(pe))}`}:null}
  }
  if(o.cmp==='none')P.prev=null;
  const src=P.context||P.recs;
  const groups=new Map();
  for(const r of src){const k=P.grain==='month'?`${r.y}-${r.m}`:r.ds;if(!groups.has(k))groups.set(k,{k:P.grain==='month'?`${MONTHS[r.m]}${P.range&&P.recs[0].y!==P.y?' '+String(r.y).slice(2):''}`:`${r.d} ${MONTHS[r.m]}`,title:P.grain==='month'?`${MONTHS_L[r.m]} ${r.y}`:fdate(r.ds),recs:[]});groups.get(k).recs.push(r)}
  P.series=[...groups.values()].map(s=>({...s,a:agg(s.recs,true)}));
  P.a=agg(P.recs,true);P.pa=P.prev?agg(P.prev.recs,true):null;
  P.T={};RPT_METRICS.forEach(k=>P.T[k]=tgtFor(k,P.y,P.m));
  // monthly cases plan: full months only
  if(P.month){P.plan=monthDoc(P.y,P.m)?.targets?.cases||null}
  else if(!P.day){
    let plan=0,act=0,n=0;const ms=new Map();P.recs.forEach(r=>{const k=`${r.y}-${r.m}`;if(!ms.has(k))ms.set(k,[]);ms.get(k).push(r)});
    for(const [k,rs] of ms){const [y,m]=k.split('-').map(Number);const last=rs[rs.length-1].d,first=rs[0].d;
      const full=first<=3&&last>=new Date(y,m+1,0).getDate()-3;const p=monthDoc(y,m)?.targets?.cases;
      if(full&&p){plan+=p;act+=rs.reduce((s,r)=>s+(r.cases||0),0);n++}}
    if(n)P.planFull={plan,act,n};
  }
  return P;
}
function rptVal(k,a,P){if(k==='loss')return (P&&(P.ytd))?a.lossYtd:a.loss;return a[k]}
const rFmt=(k,v)=>v==null?'–':nf(v,KPI[k].dp)+(KPI[k].unit==='%'?'%':KPI[k].unit?' '+KPI[k].unit:'');
function rStatus(k,v,t){if(v==null||t==null)return null;const good=KPI[k].up?v>=t:v<=t;return {good,gap:v-t,rel:t?Math.abs(v-t)/Math.abs(t)*100:0}}
function rDelta(k,v,pv){if(v==null||pv==null)return null;const pct=KPI[k].pct;const d=pct?v-pv:(pv?(v-pv)/Math.abs(pv)*100:null);if(d==null)return null;
  return {d,good:KPI[k].up?d>=0:d<=0,txt:`${d>=0?'▲':'▼'} ${nf(Math.abs(d),1)}${pct?' pts':'%'}`}}
const lossLabel=P=>P.ytd?'year to date':P.day?'month to date on this day':P.range?`month to date at ${fdate(P.end)}`:'month to date';

/* ---- auto-written commentary ---- */
function rptText(P,met){
  const a=P.a,pa=P.pa,T=P.T,has=k=>met.includes(k),out={summary:[],attention:[],commentary:[]};
  const cmpPhrase=(k)=>{const d=rDelta(k,rptVal(k,a,P),pa?rptVal(k,pa,P):null);if(!d)return '';
    const dir=d.d===0?'level with':d.d>0?'up':'down';const amt=KPI[k].pct?`${nf(Math.abs(d.d),1)} pts`:`${nf(Math.abs(d.d),1)}%`;
    return d.d===0?` (level with ${P.prev.label})`:` (${dir} ${amt} on ${P.prev.label})`};
  const vsT=(k)=>{const v=rptVal(k,a,P),t=T[k],s=rStatus(k,v,t);if(!s)return '';
    const gap=KPI[k].pct?`${nf(Math.abs(s.gap),KPI[k].dp)} pts`:`${nf(Math.abs(s.gap),KPI[k].dp)}${KPI[k].unit?' '+KPI[k].unit:''}`;
    return s.good?`, within the ${rFmt(k,t)} target`:`, ${gap} ${KPI[k].up?'below':'above'} the ${rFmt(k,t)} target`};
  // headline summary
  if(has('cases')&&a.cases!=null){
    let s=`${nf(a.cases)} cases bottled${cmpPhrase('cases')}`;
    if(P.plan)s+=`, ${nf(a.cases/P.plan*100,1)}% of the ${nf(P.plan)}-case monthly plan`;
    if(P.planFull)s+=`. Across the ${P.planFull.n} complete month${P.planFull.n>1?'s':''}, output was ${nf(P.planFull.act/P.planFull.plan*100,1)}% of plan (${nf(P.planFull.act)} vs ${nf(P.planFull.plan)})`;
    out.summary.push(s+'.');
  }
  if((has('cph')&&a.cph!=null)||(has('pcph')&&a.pcph!=null)){
    const parts=[];if(has('cph')&&a.cph!=null)parts.push(`${nf(a.cph)} cases per available hour${cmpPhrase('cph')}${vsT('cph')}`);
    if(has('pcph')&&a.pcph!=null)parts.push(`${nf(a.pcph)} per filling hour${cmpPhrase('pcph')}${vsT('pcph')}`);
    out.summary.push(`The line ran at ${parts.join(' and ')}.`);
  }
  if(has('pm'))out.summary.push(a.pm!=null?`PM compliance was ${nf(a.pm,1)}%${vsT('pm')}${cmpPhrase('pm')}.`:`PM compliance can't be reported yet: no PM data has been uploaded (target ${T.pm!=null?T.pm+'%':'not set'}).`);
  if(has('loss')){const v=rptVal('loss',a,P);if(v!=null)out.summary.push(`Process loss (volume, ${lossLabel(P)}) was ${nf(v,2)}%${vsT('loss')}${cmpPhrase('loss')}.`)}
  const ut=UT.filter(has);
  if(ut.length){
    const over=ut.map(u=>({u,v:a[u],t:T[u],s:rStatus(u,a[u],T[u])})).filter(x=>x.s&&!x.s.good).sort((x,y)=>y.s.rel-x.s.rel);
    const withT=ut.filter(u=>a[u]!=null&&T[u]!=null);
    if(withT.length){
      if(!over.length)out.summary.push(`All ${withT.length===4?'four ':''}utilities were within target.`);
      else if(over.length===withT.length&&withT.length>1){const w=over[0];out.summary.push(`All ${withT.length===4?'four':withT.length} utilities were above target. ${UT_NAME[w.u]} was furthest over at ${rFmt(w.u,w.v)} against ${rFmt(w.u,w.t)} (${nf(w.s.rel,0)}% above).`)}
      else{const w=over[0];out.summary.push(`${over.length} of ${withT.length} utilities were above target. ${UT_NAME[w.u]} was furthest over at ${rFmt(w.u,w.v)} against ${rFmt(w.u,w.t)} (${nf(w.s.rel,0)}% above).`)}
    }
  }
  // attention points: every KPI off target, largest relative gap first
  const off=[];
  met.forEach(k=>{if(k==='cases')return;const v=rptVal(k,a,P),s=rStatus(k,v,T[k]);if(s&&!s.good)off.push({k,v,s})});
  off.sort((x,y)=>y.s.rel-x.s.rel).forEach(x=>{
    const d=rDelta(x.k,x.v,pa?rptVal(x.k,pa,P):null);
    const trend=d?(d.good?`, improving on ${P.prev.label}`:`, worse than ${P.prev.label}`):'';
    out.attention.push(`${KPI[x.k].l}: ${rFmt(x.k,x.v)} vs target ${rFmt(x.k,T[x.k])} (${nf(x.s.rel,0)}% ${KPI[x.k].up?'short':'over'}${trend}).`)});
  if(P.plan&&a.cases!=null&&has('cases')&&P.recs.length){
    const dim=new Date(P.y,P.m+1,0).getDate(),last=P.recs[P.recs.length-1].d;
    if(last<dim){const need=P.plan-a.cases;if(need>0)out.attention.push(`Production needs ${nf(need)} more cases in the remaining ${dim-last} days of ${MONTHS_L[P.m]} to meet plan.`)}
    else if(a.cases<P.plan)out.attention.push(`Production finished ${nf(P.plan-a.cases)} cases short of the ${MONTHS_L[P.m]} plan.`);
  }
  // detailed commentary: best / worst periods and trends
  const S=P.series.filter(s=>s.a.cases!=null&&s.a.cases>0),unit=P.grain==='month'?'month':'day';
  const A=P.day?agg(P.context,true):a,ov=P.day?'month to date':'overall';
  if(S.length>=2&&(has('cases')||has('cph'))){
    if(has('cases')){const hi=S.reduce((x,y)=>y.a.cases>x.a.cases?y:x),lo=S.reduce((x,y)=>y.a.cases<x.a.cases?y:x);
      out.commentary.push(`Highest output ${unit}: ${hi.title} with ${nf(hi.a.cases)} cases. Lowest: ${lo.title} with ${nf(lo.a.cases)} cases.`)}
    if(has('cph')){const C=S.filter(s=>s.a.cph!=null);if(C.length>=2){const hi=C.reduce((x,y)=>y.a.cph>x.a.cph?y:x),lo=C.reduce((x,y)=>y.a.cph<x.a.cph?y:x);
      out.commentary.push(`Cases per available hour ranged from ${nf(lo.a.cph)} (${lo.title}) to ${nf(hi.a.cph)} (${hi.title}).`)}}
    if(has('cph')&&A.cph&&A.pcph){const gap=(1-A.cph/A.pcph)*100;
      out.commentary.push(`The gap between available-time and filling-time rates${P.day?' this month':''} (${nf(A.cph)} vs ${nf(A.pcph)}) means about ${nf(gap,0)}% of available time was not spent filling.`)}
  }
  if(has('loss')&&P.series.length>=2){const L=P.series.filter(s=>s.a.loss!=null);if(L.length>=2){const f=L[0].a.loss,l=L[L.length-1].a.loss;
    out.commentary.push(`Process loss (month to date) moved from ${nf(f,2)}% (${L[0].title}) to ${nf(l,2)}% (${L[L.length-1].title})${Math.abs(l-f)<0.05?', broadly flat':l<f?', an improvement':', a deterioration'}.`)}}
  ut.forEach(u=>{const V=P.series.filter(s=>s.a[u]!=null&&s.a[u]>0);if(V.length<2)return;
    const t=T[u],n=t!=null?V.filter(s=>s.a[u]<=t).length:null,hi=V.reduce((x,y)=>y.a[u]>x.a[u]?y:x);
    out.commentary.push(`${UT_NAME[u]}: ${rFmt(u,A[u])} ${ov}${n!=null?`; ${n} of ${V.length} ${unit}s within the ${rFmt(u,t)} target`:''}. Highest was ${hi.title} at ${rFmt(u,hi.a[u])}.`)});
  if(has('pm')&&a.pm!=null&&P.series.length>=2){const V=P.series.filter(s=>s.a.pm!=null),t=T.pm;if(V.length&&t!=null)out.commentary.push(`PM compliance met the ${t}% target in ${V.filter(s=>s.a.pm>=t).length} of ${V.length} ${unit}s.`)}
  const ends=[['Production',['cases']],['Utilities',UT],['Process loss',['plMtd']]].map(([n,ks])=>{let d=null;P.recs.forEach(r=>{if(ks.some(k=>r[k]!=null))d=r.ds});return d?[n,d]:null}).filter(Boolean);
  if(new Set(ends.map(e=>e[1])).size>1)out.commentary.push(`Note: the data runs to different dates. ${ends.map(e=>`${e[0]} to ${fdate(e[1])}`).join(', ')}.`);
  return out;
}

/* ---- charts rendered to images, so they print and travel with the downloaded report ---- */
function chartImg(cfg,w=900,h=300){
  const host=document.createElement('div');host.style.cssText='position:fixed;left:-10000px;top:0;width:'+w+'px;height:'+h+'px';
  const c=document.createElement('canvas');c.width=w;c.height=h;host.appendChild(c);document.body.appendChild(host);
  let url='';
  try{
    const o=cfg.options||{};o.responsive=false;o.animation=false;o.devicePixelRatio=2;o.color=RC.ink;
    o.plugins=o.plugins||{};o.plugins.legend=Object.assign({labels:{color:RC.ink,boxWidth:10,boxHeight:10,font:{size:12}}},o.plugins.legend||{});
    Object.values(o.scales||{}).forEach(s=>{s.ticks=Object.assign({color:RC.muted,font:{size:11}},s.ticks||{});s.grid=Object.assign({color:RC.line},s.grid||{})});
    const ch=new Chart(c,{...cfg,options:o,plugins:[{id:'bg',beforeDraw(x){const g=x.ctx;g.save();g.fillStyle='#fff';g.fillRect(0,0,x.width,x.height);g.restore()}}]});
    url=c.toDataURL('image/png');ch.destroy();
  }catch(e){url=''}
  host.remove();return url;
}
function rptCharts(P,met,which){
  const L=P.series.map(s=>s.k),out=[],sel=P.day?P.series.length-1:-1;
  const fade=(c,i)=>sel<0||i===sel?c:c+'66';
  const tl=(t,lab='Target')=>t==null?[]:[{type:'line',label:lab,data:L.map(()=>t),borderColor:RC.grey,borderDash:[5,4],borderWidth:1.5,pointRadius:0}];
  if(which.includes('prod')&&(met.includes('cases')||met.includes('cph')||met.includes('pcph'))){
    const ds=[];
    if(met.includes('cases'))ds.push({type:'bar',label:'Cases bottled',data:P.series.map(s=>s.a.cases),backgroundColor:P.series.map((_,i)=>fade(RC.navy,i)),yAxisID:'y',order:3});
    if(met.includes('cph'))ds.push({type:'line',label:'Cases per available hour',data:P.series.map(s=>s.a.cph),borderColor:RC.amber,backgroundColor:RC.amber,yAxisID:'y1',pointRadius:2.5,borderWidth:2,order:1,spanGaps:true});
    if(met.includes('pcph'))ds.push({type:'line',label:'Cases per filling hour',data:P.series.map(s=>s.a.pcph),borderColor:RC.sky,backgroundColor:RC.sky,yAxisID:'y1',pointRadius:2.5,borderWidth:2,order:2,spanGaps:true});
    out.push({t:`Production cases and cases per hour, by ${P.grain}`,img:chartImg({data:{labels:L,datasets:ds},options:{plugins:{legend:{display:true,position:'top',align:'end'}},
      scales:{x:{grid:{display:false}},y:{beginAtZero:true,title:{display:true,text:'Cases',color:RC.muted}},y1:{position:'right',beginAtZero:true,grid:{display:false},title:{display:true,text:'Cases per hour',color:RC.muted}}}}})});
  }
  if(which.includes('loss')&&met.includes('pm')&&P.series.some(s=>s.a.pm!=null)){
    const t=P.T.pm;out.push({t:'PM compliance %',img:chartImg({data:{labels:L,datasets:[{type:'bar',label:'PM compliance',data:P.series.map(s=>s.a.pm),backgroundColor:P.series.map((s,i)=>fade(t==null||s.a.pm==null?RC.navy:s.a.pm>=t?RC.good:RC.bad,i))},...tl(t)]},
      options:{plugins:{legend:{display:false}},scales:{x:{grid:{display:false}},y:{beginAtZero:true,suggestedMax:100}}}},900,240)});
  }
  if(which.includes('loss')&&met.includes('loss')&&P.series.some(s=>s.a.loss!=null)){
    const t=P.T.loss;out.push({t:`Process loss % (volume, month to date) by ${P.grain}`,img:chartImg({data:{labels:L,datasets:[{type:P.grain==='month'?'bar':'line',label:'Process loss',data:P.series.map(s=>s.a.loss),borderColor:RC.navy,borderWidth:2,pointRadius:2.5,spanGaps:true,
      backgroundColor:P.grain==='month'?P.series.map((s,i)=>fade(t==null||s.a.loss==null?RC.navy:s.a.loss<=t?RC.good:RC.bad,i)):RC.navy},...tl(t)]},
      options:{plugins:{legend:{display:false}},scales:{x:{grid:{display:false}},y:{beginAtZero:P.grain==='month'}}}},900,240)});
  }
  if(which.includes('util')){
    UT.filter(u=>met.includes(u)).forEach(u=>{if(!P.series.some(s=>s.a[u]!=null))return;const t=P.T[u];
      out.push({t:`${UT_NAME[u]} (${UT_UNIT[u]})`,half:true,img:chartImg({data:{labels:L,datasets:[{type:P.grain==='month'?'bar':'line',label:UT_NAME[u],data:P.series.map(s=>s.a[u]),borderColor:u==='elec'?RC.amber:RC.navy,borderWidth:2,pointRadius:2,spanGaps:true,
        backgroundColor:P.grain==='month'?P.series.map((s,i)=>fade(t==null||s.a[u]==null?RC.navy:s.a[u]<=t?RC.good:RC.bad,i)):(u==='elec'?RC.amber:RC.navy)},...tl(t)]},
        options:{plugins:{legend:{display:false}},scales:{x:{grid:{display:false}},y:{beginAtZero:P.grain==='month'}}}},600,280)})});
  }
  return out;
}

/* ---- report document ---- */
const RPT_CSS=`
.rpt{font-family:Barlow,"Segoe UI",Arial,sans-serif;color:#0E1B2C;background:#fff;max-width:900px;margin:0 auto;padding:28px 34px 34px;font-size:13.5px;line-height:1.45}
.rpt *{box-sizing:border-box}

.rpt .rh img{height:54px}
.rpt .rh h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:26px;letter-spacing:.6px;text-transform:uppercase;color:#01427A;margin:0;line-height:1.05}
.rpt .rh .p{font-size:15px;font-weight:600;margin-top:3px}
.rpt .meta{display:flex;flex-wrap:wrap;gap:4px 22px;font-size:12px;color:#5B6878;margin:0 0 14px}
.rpt h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:17px;letter-spacing:.8px;text-transform:uppercase;color:#01427A;margin:18px 0 6px;border-bottom:1px solid #D9E1EA;padding-bottom:3px}
.rpt ul{margin:4px 0 0;padding-left:18px}.rpt li{margin:3px 0}
.rpt table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.rpt th{background:#01427A;color:#fff;font-weight:600;text-align:right;padding:5px 7px;white-space:nowrap}
.rpt td{padding:5px 7px;text-align:right;border-bottom:1px solid #E6EBF1;white-space:nowrap}
.rpt th:first-child,.rpt td:first-child{text-align:left}
.rpt tbody tr:nth-child(even) td{background:#F6F8FB}
.rpt tfoot td{font-weight:700;border-top:2px solid #01427A;background:#fff}
.rpt .g{color:#1E8449;font-weight:600}.rpt .b{color:#C0392B;font-weight:600}.rpt .m{color:#5B6878}
.rpt .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.rpt .tw{overflow-x:auto}
.rpt .ch{margin:8px 0 4px;break-inside:avoid}.rpt .ch img{width:100%;height:auto;border:1px solid #E6EBF1;border-radius:4px}
.rpt .ch .ct{font-weight:600;font-size:13px;margin:0 0 4px}
.rpt .cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rpt .notes{white-space:pre-wrap;background:#F6F8FB;border-left:4px solid #E0A21B;padding:8px 12px}
.rpt .foot{margin-top:18px;border-top:1px solid #D9E1EA;padding-top:6px;font-size:11px;color:#5B6878}

@media (max-width:640px){.rpt{padding:18px 14px}.rpt .cgrid{grid-template-columns:1fr}.rpt .rh img{height:40px}.rpt .rh h1{font-size:21px}}
@media print{.rpt{max-width:none;padding:0}.rpt h2{break-after:avoid}.rpt table,.rpt .ch{break-inside:avoid}}
`;
function rptBuild(o){
  const P=rptPeriod(o);if(!P)return null;
  const met=RPT_METRICS.filter(k=>o.metrics.includes(k)),sec=o.sections,a=P.a,pa=P.pa;
  const txt=rptText(P,met),E=esc;
  const logo=document.querySelector('.logo')?.src||'';
  const title=o.title||RPT_TYPES[o.type]?.l||'Production report';
  const genAt=new Date().toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  let h=`<div class="rpt"><div class="rh">${logo?`<img src="${logo}" alt="Carib Brewery">`:''}<div><h1>${E(title)}</h1><div class="p">${E(P.label)}${P.sub&&!P.day?` <span class="m" style="font-weight:400">(${E(P.sub)})</span>`:''}</div></div></div>
  <div class="meta">${o.to_?`<span>Prepared for: <b>${E(o.to_)}</b></span>`:''}${o.by?`<span>Prepared by: <b>${E(o.by)}</b></span>`:''}<span>Generated ${E(genAt)}</span>${P.prev?`<span>Compared with: ${E(P.prev.label)}</span>`:''}</div>`;
  const list=(arr,empty)=>arr.length?`<ul>${arr.map(s=>`<li>${E(s)}</li>`).join('')}</ul>`:`<p class="none">${empty}</p>`;
  if(sec.includes('summary'))h+=`<h2>Summary</h2>${list(txt.summary,'No data for the selected measures in this period.')}`;
  if(sec.includes('kpis')){
    h+=`<h2>KPI scorecard</h2><div class="tw"><table><thead><tr><th>Measure</th><th>Actual</th><th>Target</th><th>Status</th>${P.prev?`<th>${E(P.prev.label)}</th><th>Change</th>`:''}</tr></thead><tbody>`;
    for(const k of met){
      const v=rptVal(k,a,P),t=k==='cases'?(P.plan||null):P.T[k],s=rStatus(k,v,t),pv=pa?rptVal(k,pa,P):null,d=rDelta(k,v,pv);
      const name=KPI[k].l+(k==='loss'?` (${lossLabel(P)})`:k==='cases'&&P.plan?' vs monthly plan':'');
      const stat=s?`<span class="${s.good?'g':'b'}"><span class="dot" style="background:${s.good?RC.good:RC.bad}"></span>${s.good?'On target':'Off target'}</span>`:(k==='cases'&&P.plan&&v!=null?`${nf(v/P.plan*100,1)}% of plan`:'<span class="m">–</span>');
      h+=`<tr><td>${E(name)}</td><td>${rFmt(k,v)}</td><td>${t!=null?(k==='cases'?nf(t):rFmt(k,t)):'<span class="m">None</span>'}</td><td>${stat}</td>${P.prev?`<td>${rFmt(k,pv)}</td><td class="${d?(d.good?'g':'b'):''}">${d?d.txt:'–'}</td>`:''}</tr>`;
    }
    h+=`</tbody></table></div>`;
  }
  if(sec.includes('attention'))h+=`<h2>Attention points</h2>${list(txt.attention,'Every measure with a target is on target for this period.')}`;
  if(sec.includes('commentary'))h+=`<h2>Commentary</h2>${list(txt.commentary,'Not enough data points in this period for trend commentary.')}`;
  if(sec.includes('breakdown')&&P.series.length){
    const cols=met;
    h+=`<h2>Breakdown by ${P.grain}${P.day?' (month to date)':''}</h2><div class="tw"><table><thead><tr><th>${P.grain==='month'?'Month':'Date'}</th>${cols.map(k=>`<th>${E(KPI[k].l.replace('Production cases per hour','Prod. cases/hr').replace('Cases per hour','Cases/hr').replace('Production cases','Cases').replace('PM compliance','PM %').replace('Process loss','Proc. loss %'))}</th>`).join('')}</tr></thead><tbody>`;
    const cell=(k,v,tt)=>{if(v==null)return '<td class="m">–</td>';const s=rStatus(k,v,tt);return `<td class="${s?(s.good?'g':'b'):''}">${nf(v,KPI[k].dp)}</td>`};
    for(const s of P.series.filter(s=>cols.some(k=>(k==='loss'?s.a.loss:s.a[k])!=null)))h+=`<tr${P.day&&s===P.series[P.series.length-1]?' style="outline:2px solid #E0A21B"':''}><td>${E(P.grain==='month'?s.title:s.k)}</td>${cols.map(k=>cell(k,k==='loss'?s.a.loss:s.a[k],k==='cases'?null:P.T[k])).join('')}</tr>`;
    const tot=P.day?agg(P.context,true):a;
    h+=`</tbody><tfoot><tr><td>${P.day?'Month to date':'Period'}</td>${cols.map(k=>cell(k,k==='loss'?(P.ytd?tot.lossYtd:tot.loss):tot[k],k==='cases'?null:P.T[k])).join('')}</tr></tfoot></table></div>`;
    const uts=UT.filter(u=>cols.includes(u));h+=`<p class="m" style="font-size:11.5px;margin:4px 0 0">Green is on target, red is off target.${uts.length?` Utilities in ${uts.map(u=>UT_UNIT[u]).join(', ')}.`:''}${cols.includes('loss')?` Process loss is month to date at the end of each ${P.grain}.`:''}</p>`;
  }
  if(sec.includes('charts')){
    const imgs=rptCharts(P,met,o.charts||['prod','loss','util']);
    if(imgs.length){h+=`<h2>Charts</h2>`;const full=imgs.filter(x=>!x.half),half=imgs.filter(x=>x.half);
      full.forEach(x=>{if(x.img)h+=`<div class="ch"><p class="ct">${E(x.t)}</p><img src="${x.img}" alt="${E(x.t)}"></div>`});
      if(half.length)h+=`<div class="cgrid">${half.map(x=>x.img?`<div class="ch"><p class="ct">${E(x.t)}</p><img src="${x.img}" alt="${E(x.t)}"></div>`:'').join('')}</div>`}
  }
  if(sec.includes('notes')&&o.notes&&o.notes.trim())h+=`<h2>Notes</h2><div class="notes">${E(o.notes.trim())}</div>`;
  const files=(INFO&&INFO.files)||[];
  h+=`<div class="foot">Source: CBG Gross Efficiency, Utilities Tracking and Daily Process Report workbooks${files.length?` (${files.length} files)`:''}. Cases per hour = cases ÷ available hours; production cases per hour = cases ÷ filling hours; utilities = total usage ÷ production hl. </div></div>`;
  // plain-text version for email / clipboard
  const lines=[`${title}: ${P.label}`,''];
  if(txt.summary.length){lines.push('Summary');txt.summary.forEach(s=>lines.push('- '+s));lines.push('')}
  if(txt.attention.length&&sec.includes('attention')){lines.push('Attention points');txt.attention.forEach(s=>lines.push('- '+s));lines.push('')}
  if(o.notes&&o.notes.trim()&&sec.includes('notes')){lines.push('Notes',o.notes.trim(),'')}
  return {html:h,text:lines.join('\n'),title:`${title} - ${P.label}`};
}

/* ---- options dialog ---- */
function showReportDialog(){
  if(!RECS.length){toast('There is no data to report on yet.');return}
  const pf=rptPrefs(),dlg=document.getElementById('dlg');
  const type=pf.type||'md',T0=RPT_TYPES[type];

  dlg.showModal();

  const vis=()=>{const k=$('#rKind').value;$('#rYearL').hidden=k!=='ytd';$('#rMonthL').hidden=k!=='month';$('#rDateL').hidden=k!=='day';$('#rFromL').hidden=k!=='range';$('#rToL').hidden=k!=='range'};vis();

  dlg.querySelectorAll('input[name="rtype"]').forEach(r=>r.onchange=()=>{const t=RPT_TYPES[r.value];
    dlg.querySelectorAll('input[name="met"]').forEach(c=>c.checked=t.met.includes(c.value));
    dlg.querySelectorAll('input[name="sec"]').forEach(c=>c.checked=t.sec.includes(c.value));
    $('#rTitle').value=t.l});
  $('[data-d="cancel"]').onclick=()=>dlg.close();
  $('[data-d="go"]').onclick=()=>{
    const o={type:dlg.querySelector('input[name="rtype"]:checked').value,kind:$('#rKind').value,year:$('#rYear').value,month:$('#rMonth').value,date:$('#rDate').value,from:$('#rFrom').value,to:$('#rTo').value,cmp:$('#rCmp').value,
      metrics:[...dlg.querySelectorAll('input[name="met"]:checked')].map(c=>c.value),sections:[...dlg.querySelectorAll('input[name="sec"]:checked')].map(c=>c.value),
      title:$('#rTitle').value.trim(),to_:$('#rTo_').value.trim(),by:$('#rBy').value.trim(),notes:$('#rNotes').value};
    o.charts=RPT_TYPES[o.type].charts;if(o.type!=='md'&&o.type!=='util'&&o.type!=='prod')o.charts=['prod','loss','util'];
    if(!o.metrics.length){$('#rMsg').textContent='Choose at least one measure.';return}
    if(!o.sections.length){$('#rMsg').textContent='Choose at least one section.';return}
    if(o.kind==='day'&&!RECS.some(r=>r.ds===o.date)){$('#rMsg').textContent=`No data for ${fdate(o.date)}. Pick another date.`;return}
    const R=rptBuild(o);if(!R){$('#rMsg').textContent='No data in that period.';return}
    rptSavePrefs(o);dlg.close();showReport(R);
  };
}

/* ---- report viewer ---- */
function showReport(R){
  let v=document.getElementById('rptView');
  if(!v){v=document.createElement('div');v.id='rptView';document.body.appendChild(v)}
  v.innerHTML=`<div class="rv-bar"><button class="btn" data-r="back">‹ Back to dashboard</button><span class="rv-t">${esc(R.title)}</span>
    <button class="btn" data-r="copy">Copy summary</button><button class="btn" data-r="email">Email summary</button><button class="btn" data-r="html">Download</button><button class="btn primary" data-r="print">Print / Save as PDF</button></div>
    <div class="rv-page">${R.html}</div>`;
  v.hidden=false;document.body.classList.add('rpt-open');v.scrollTop=0;
  const q=s=>v.querySelector(s);
  q('[data-r="back"]').onclick=()=>{v.hidden=true;document.body.classList.remove('rpt-open')};
  q('[data-r="print"]').onclick=()=>{const t=document.title;document.title=R.title;window.print();setTimeout(()=>document.title=t,500)};
  q('[data-r="copy"]').onclick=async()=>{try{await navigator.clipboard.writeText(R.text);toast('Summary copied. Paste it into an email or message.')}catch(e){toast('Copy was blocked by the browser. Use Download instead.')}};
  q('[data-r="email"]').onclick=()=>{const body=R.text.length>1800?R.text.slice(0,1800)+'…':R.text;location.href=`mailto:?subject=${encodeURIComponent(R.title)}&body=${encodeURIComponent(body)}`};
  q('[data-r="html"]').onclick=()=>{
    const doc=`<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(R.title)}</title><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet"><style>body{margin:0;background:#fff}${RPT_CSS}</style></head><body>${R.html}</body></html>`;
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([doc],{type:'text/html'}));a.download=R.title.replace(/[^\w\- ]+/g,'').replace(/\s+/g,'_')+'.html';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
    toast('Report downloaded. Open it in any browser, or print it to PDF.');
  };
}

/* ============ events ============ */
document.getElementById('rptBtn').onclick=showReportDialog;
let tt;function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),4500)}
document.getElementById('mode').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.mode=b.dataset.m;render()});
document.getElementById('year').onchange=e=>{S.year=+e.target.value;S.month=null;S.date=null;render()};
document.getElementById('month').onchange=e=>{S.month=+e.target.value;S.date=null;render()};
document.getElementById('date').onchange=e=>{const v=e.target.value;if(!v)return;
  if(!RECS.some(r=>r.ds===v)){toast(`No data for ${fdate(v)}.`);e.target.value=S.date||'';return}
  S.year=+v.slice(0,4);S.month=+v.slice(5,7)-1;S.date=v;render()};
document.getElementById('excl').onchange=e=>{S.excl=e.target.checked;render()};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);
new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

render();loadData();
