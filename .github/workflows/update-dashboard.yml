name: Update dashboard

# Runs whenever files are pushed (for example new files added to data/raw),
# and can also be started by hand from the Actions tab.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'data/dashboard-data.json'
      - 'data/build-report.txt'
      - 'data/dashboard-data.js'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the build knows which upload of a file is the newest

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Excel reader
        run: npm ci --no-audit --no-fund

      - name: Read raw files and build the dashboard data
        run: node scripts/build-data.js

      # Keeps a copy of the data in the repository. It never touches index.html or README.md,
      # so uploading those can't clash with this step. If someone uploads while it runs, it retries.
      - name: Save the data file in the repository
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard-data.json data/dashboard-data.js data/build-report.txt
          if git diff --cached --quiet; then echo "Data unchanged"; exit 0; fi
          git commit -m "Update dashboard data"
          for i in 1 2 3; do
            git push && exit 0
            echo "Someone pushed meanwhile, retrying ($i)"
            sleep 5
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || { git rebase --abort; exit 1; }
          done
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Publishes the website (Settings > Pages > Source: GitHub Actions).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
