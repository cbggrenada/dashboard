name: Update dashboard

# Runs whenever files are pushed (for example new files added to data/raw),
# and can also be started by hand from the Actions tab.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'data/dashboard-data.json'
      - 'data/build-report.txt'
      - 'data/dashboard-data.js'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Excel reader
        run: npm ci --no-audit --no-fund

      - name: Read raw files and build the dashboard data
        run: node scripts/build-data.js

      - name: Save the data file in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/dashboard-data.json data/dashboard-data.js data/build-report.txt
          if git diff --cached --quiet; then
            echo "Data unchanged"
          else
            git commit -m "Update dashboard data"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Publishes when Settings > Pages > Source is "GitHub Actions".
  # If Pages is set to "Deploy from a branch" instead, this step is skipped over
  # and the data file saved above is what the site uses.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
